services:
  - type: web
    name: airwatch-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATA_GOV_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.6"
